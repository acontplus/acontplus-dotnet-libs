name: CI — Build, Test & Pack

on:
  pull_request:
    branches:
      - main
      - develop
    # Do not add a paths filter here. A skipped required check remains pending
    # and can block pull-request merges.
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

# Cancel an in-progress run when a newer commit is added to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Audit package vulnerabilities (direct and transitive)
        run: dotnet list package --vulnerable --include-transitive

      - name: Build solution
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        shell: bash
        run: |
          mkdir -p TestResults/coverage
          while IFS= read -r test_project; do
            test_name="$(basename "${test_project%.csproj}")"
            dotnet test --project "$test_project" \
              --configuration ${{ env.CONFIGURATION }} \
              --no-build \
              --verbosity normal \
              --coverage \
              --coverage-output "$PWD/TestResults/coverage/${test_name}.cobertura.xml" \
              --coverage-output-format cobertura
          done < <(find tests -name "*.Tests.Unit.csproj" -print | sort)

      - name: Upload code coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ github.run_id }}
          path: TestResults/coverage/*.cobertura.xml
          retention-days: 14
          if-no-files-found: warn

  validate-packages:
    name: Validate Package Versions
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate package versions
        shell: pwsh
        run: |
          Write-Host "Validating package versions..."

          $projectFiles = Get-ChildItem -Path "src" -Filter "*.csproj" -Recurse
          $errors = @()

          foreach ($project in $projectFiles) {
            [xml]$csproj = Get-Content $project.FullName
            $packageId = $csproj.Project.PropertyGroup.PackageId | Select-Object -First 1
            $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
            $generatePackage = $csproj.Project.PropertyGroup.GeneratePackageOnBuild | Select-Object -First 1

            if ($generatePackage -ne "true" -or [string]::IsNullOrEmpty($packageId)) {
              continue
            }

            # Validate semantic versioning
            if ($version -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9\.\-]+)?(\+[a-zA-Z0-9\.\-]+)?$') {
              $errors += "❌ $packageId has invalid version format: $version"
            }
            else {
              Write-Host "✅ $packageId v$version - Valid"
            }
          }

          if ($errors.Count -gt 0) {
            Write-Host "`n❌ Validation Errors:"
            foreach ($error in $errors) {
              Write-Host $error
            }
            exit 1
          }

          Write-Host "`n✅ All package versions are valid!"

  pack-verify:
    name: Pack and Verify
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build
        run: |
          dotnet restore
          dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Pack all packages
        run: |
          mkdir -p nupkgs
          dotnet pack --configuration ${{ env.CONFIGURATION }} --no-build --output nupkgs

      - name: List generated packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "nupkgs" -Filter "*.nupkg"

          Write-Host "📦 Generated NuGet Packages:"
          Write-Host "=============================="

          foreach ($pkg in $packages) {
            $sizeKB = [math]::Round($pkg.Length / 1KB, 2)
            Write-Host "  - $($pkg.Name) ($sizeKB KB)"
          }

          Write-Host "`nTotal packages: $($packages.Count)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg
          retention-days: 7

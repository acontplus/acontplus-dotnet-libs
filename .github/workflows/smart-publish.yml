name: Release — Publish NuGet Packages

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "src/**/*.csproj"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Commit immediately before the package version changes"
        required: true
        type: string
      source_sha:
        description: "Commit containing the package versions to publish"
        required: true
        type: string
      confirm_publish:
        description: "Confirm that the selected package versions may be published"
        required: true
        default: false
        type: boolean

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && (github.event.pull_request.merge_commit_sha || github.sha) || inputs.source_sha }}

permissions:
  contents: write

# Prevents duplicate runs with other workflows
concurrency:
  group: publish-${{ github.event.pull_request.number || inputs.source_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  check-eligibility:
    name: Check Workflow Eligibility
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      reason: ${{ steps.check.outputs.reason }}

    steps:
      - name: Check if this workflow should run
        id: check
        shell: pwsh
        env:
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
          MANUAL_CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:GITHUB_REF -ne "refs/heads/main") {
              throw "Manual publishing is only allowed from the main branch."
            }

            if ($env:MANUAL_CONFIRM_PUBLISH -ne "true") {
              throw "Set confirm_publish=true to authorize a manual package publication."
            }

            if ([string]::IsNullOrWhiteSpace($env:MANUAL_BASE_SHA) -or
                [string]::IsNullOrWhiteSpace($env:MANUAL_SOURCE_SHA)) {
              throw "base_sha and source_sha are required for a manual publication."
            }

            "should-run=true" >> $env:GITHUB_OUTPUT
            "reason=manual-dispatch" >> $env:GITHUB_OUTPUT
            Write-Host "✅ Proceeding: manually publishing the selected release range"
          }
          else {
            "should-run=true" >> $env:GITHUB_OUTPUT
            "reason=normal-pr" >> $env:GITHUB_OUTPUT
            Write-Host "✅ Proceeding: publishing versioned packages from the merged PR"
          }

  analyze-changes:
    name: Analyze Package Changes
    needs: check-eligibility
    runs-on: ubuntu-latest
    if: needs.check-eligibility.outputs.should-run == 'true'
    outputs:
      changed-packages: ${{ steps.analyze.outputs.changed-packages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Analyze changed packages and dependencies
        id: analyze
        shell: pwsh
        run: |
          Write-Host "================================================"
          Write-Host "Smart Publish - Analyzing Changes"
          Write-Host "================================================`n"

          # Compare the exact merge range. A project-file change without a package
          # version change must not result in a NuGet publication.
          $baseSha = $env:BASE_SHA
          $sourceSha = $env:SOURCE_SHA

          git cat-file -e "${baseSha}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "The supplied base_sha is not a commit available in the repository: $baseSha"
          }

          git cat-file -e "${sourceSha}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "The supplied source_sha is not a commit available in the repository: $sourceSha"
          }

          git merge-base --is-ancestor $baseSha $sourceSha
          if ($LASTEXITCODE -ne 0) {
            throw "base_sha must be an ancestor of source_sha."
          }

          $changedFiles = git diff --name-only $baseSha $sourceSha | Where-Object { $_ -like "src/*/*.csproj" }
          $changedPackages = @()

          foreach ($file in $changedFiles) {
            if (Test-Path $file) {
              $projectXml = (Get-Content -Raw -Path $file).TrimStart([char]0xFEFF)
              [xml]$csproj = $projectXml
              $packageId = $csproj.Project.PropertyGroup.PackageId | Select-Object -First 1
              $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1

              if ($packageId -and $version) {
                $previousVersion = $null
                $previousProject = git show "${baseSha}:$file" 2>$null
                $previousExitCode = $LASTEXITCODE

                if ($previousExitCode -eq 0) {
                  $previousXml = ($previousProject -join [Environment]::NewLine).TrimStart([char]0xFEFF)
                  [xml]$previousCsproj = $previousXml
                  $previousVersion = $previousCsproj.Project.PropertyGroup.Version | Select-Object -First 1
                }

                if ($previousVersion -eq $version) {
                  Write-Host "⏭️ Skipping ${packageId}: version remains $version"
                  continue
                }

                Write-Host "`n📦 Version change: $packageId $previousVersion → $version"
                $changedPackages += @{
                  Name = $packageId
                  Version = $version
                }
              }
            }
          }

          Write-Host "`n================================================"
          Write-Host "Analysis Result:"
          Write-Host "================================================"
          Write-Host "Versioned packages: $($changedPackages.Count)"
          Write-Host "Strategy: ✅ PUBLISH CHANGED PACKAGES" -ForegroundColor Green
          Write-Host "Requirement: dependent package references and versions must be updated in the merged PR." -ForegroundColor Green

          # Ensure valid JSON output (empty array if no changes)
          if ($changedPackages.Count -eq 0) {
            $packagesJson = "[]"
          } elseif ($changedPackages.Count -eq 1) {
            $packagesJson = $changedPackages | ConvertTo-Json -Compress
            $packagesJson = "[$packagesJson]"
          } else {
            $packagesJson = $changedPackages | ConvertTo-Json -Compress
          }

          "changed-packages=$packagesJson" >> $env:GITHUB_OUTPUT

  simple-publish:
    name: Publish Changed Packages
    needs: [check-eligibility, analyze-changes]
    if: needs.check-eligibility.outputs.should-run == 'true' && needs.analyze-changes.outputs.changed-packages != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # Required for NuGet Trusted Publishing (OIDC)
      contents: read
    strategy:
      matrix:
        package: ${{ fromJson(needs.analyze-changes.outputs.changed-packages) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Prepare local nupkgs feed
        run: |
          mkdir -p nupkgs
          dotnet nuget remove source local-nupkgs || true
          dotnet nuget add source "$(pwd)/nupkgs" --name local-nupkgs

      - name: Restore dependencies
        run: |
          dotnet nuget locals http-cache --clear
          dotnet restore --force --source "$(pwd)/nupkgs" --source https://api.nuget.org/v3/index.json

      - name: Build solution
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        run: |
          TEST_PROJECT=$(find tests -name "${{ matrix.package.Name }}.Tests.Unit.csproj" 2>/dev/null | head -n 1)
          if [ -n "$TEST_PROJECT" ]; then
            echo "Running tests for ${{ matrix.package.Name }}"
            mkdir -p TestResults/coverage
            dotnet test --project "$TEST_PROJECT" \
              --configuration ${{ env.CONFIGURATION }} \
              --no-build \
              --coverage \
              --coverage-output "$PWD/TestResults/coverage/${{ matrix.package.Name }}.cobertura.xml" \
              --coverage-output-format cobertura
          else
            echo "No tests found for ${{ matrix.package.Name }}"
          fi

      - name: Upload code coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ matrix.package.Name }}-${{ matrix.package.Version }}
          path: TestResults/coverage/*.cobertura.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Find project file
        id: find-project
        shell: pwsh
        run: |
          $packageName = "${{ matrix.package.Name }}"
          $projectPath = Get-ChildItem -Path "src" -Filter "$packageName.csproj" -Recurse | Select-Object -First 1

          if ($null -eq $projectPath) {
            Write-Error "Project file not found for $packageName"
            exit 1
          }

          Write-Host "Found project: $($projectPath.FullName)"
          "project-path=$($projectPath.FullName)" >> $env:GITHUB_OUTPUT

      - name: Pack NuGet package
        run: |
          dotnet pack "${{ steps.find-project.outputs.project-path }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output nupkgs

      - name: Authenticate with NuGet.org (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Verify package availability (tolerant)
        shell: pwsh
        run: |
          $packageName = "${{ matrix.package.Name }}"
          $version = "${{ matrix.package.Version }}"

          Write-Host "Waiting 30s for NuGet indexing..."
          Start-Sleep -Seconds 30

          $maxRetries = 20
          $verified = $false
          $baseDelay = 8

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $searchUrl = "https://api.nuget.org/v3-flatcontainer/$($packageName.ToLower())/index.json"
              $response = Invoke-RestMethod -Uri $searchUrl -ErrorAction Stop

              if ($response.versions -contains $version) {
                Write-Host "✅ Package $packageName v$version verified on NuGet.org"
                $verified = $true
                break
              }
            }
            catch {
              Write-Host "Retry $i/$maxRetries - package not yet available..."
            }

            $delay = [math]::Min($baseDelay + ($i * 4), 60)
            Write-Host "⏳ Waiting $delay s before next check..."
            Start-Sleep -Seconds $delay
          }

          if (-not $verified) {
            Write-Host "⚠️ WARNING: Package $packageName v$version not visible after $maxRetries retries" -ForegroundColor Yellow
            Write-Host "Continuing; downstream restores may use local artifacts (nupkgs) or retry later." -ForegroundColor Yellow
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.package.Name }}-${{ matrix.package.Version }}
          path: nupkgs/*.nupkg
          retention-days: 30

  trigger-recovery:
    name: Trigger Recovery Publish
    needs: [check-eligibility, analyze-changes, simple-publish]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.check-eligibility.result == 'success' &&
      (needs.analyze-changes.result == 'failure' || needs.simple-publish.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Check for unpublished versions
        id: unpublished
        shell: pwsh
        run: |
          $baseSha = $env:BASE_SHA
          $sourceSha = $env:SOURCE_SHA
          $unpublishedPackages = @()

          git cat-file -e "${baseSha}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "The release base commit is not available: $baseSha"
          }

          git cat-file -e "${sourceSha}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "The release source commit is not available: $sourceSha"
          }

          git merge-base --is-ancestor $baseSha $sourceSha
          if ($LASTEXITCODE -ne 0) {
            throw "The release base commit must be an ancestor of the source commit."
          }

          $changedFiles = git diff --name-only $baseSha $sourceSha | Where-Object { $_ -like "src/*/*.csproj" }

          foreach ($file in $changedFiles) {
            if (-not (Test-Path $file)) {
              continue
            }

            $projectXml = (Get-Content -Raw -Path $file).TrimStart([char]0xFEFF)
            [xml]$csproj = $projectXml
            $packageId = $csproj.Project.PropertyGroup.PackageId | Select-Object -First 1
            $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1

            if (-not $packageId -or -not $version) {
              continue
            }

            $previousProject = git show "${baseSha}:$file" 2>$null
            $previousExitCode = $LASTEXITCODE
            if ($previousExitCode -eq 0) {
              $previousXml = ($previousProject -join [Environment]::NewLine).TrimStart([char]0xFEFF)
              [xml]$previousCsproj = $previousXml
              $previousVersion = $previousCsproj.Project.PropertyGroup.Version | Select-Object -First 1
              if ($previousVersion -eq $version) {
                continue
              }
            }

            try {
              $url = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json"
              $published = Invoke-RestMethod -Uri $url -ErrorAction Stop
              if ($published.versions -contains "$version") {
                Write-Host "✅ $packageId $version is already available on NuGet.org"
                continue
              }
            }
            catch {
              Write-Host "ℹ️ $packageId is not available on NuGet.org yet"
            }

            $unpublishedPackages += "$packageId $version"
            Write-Host "📦 Missing publication: $packageId $version"
          }

          if ($unpublishedPackages.Count -eq 0) {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host "✅ No missing package versions detected; recovery dispatch is not needed."
          }
          else {
            "found=true" >> $env:GITHUB_OUTPUT
            Write-Host "⚠️ Missing package versions detected; starting one guarded recovery dispatch."
          }

      - name: Dispatch guarded recovery publish
        if: steps.unpublished.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ env.BASE_SHA }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/smart-publish.yml/dispatches" \
            -f ref=main \
            -f "inputs[base_sha]=${BASE_SHA}" \
            -f "inputs[source_sha]=${SOURCE_SHA}" \
            -f "inputs[confirm_publish]=true"

          echo "✅ Recovery publish dispatched for ${BASE_SHA}..${SOURCE_SHA}"

  create-release:
    name: Create GitHub Release
    needs: [check-eligibility, analyze-changes, simple-publish]
    if: needs.check-eligibility.outputs.should-run == 'true' && needs.analyze-changes.outputs.changed-packages != '[]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release notes
        id: notes
        shell: pwsh
        run: |
          $packages = '${{ needs.analyze-changes.outputs.changed-packages }}' | ConvertFrom-Json

          $notes = "## 📦 Package Release`n`n"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $notes += "**Merged PR**: #${{ github.event.pull_request.number }}`n"
          }
          else {
            $notes += "**Manual dispatch**: release range $env:BASE_SHA..$env:SOURCE_SHA`n"
          }
          if ("${{ github.event_name }}" -eq "pull_request") {
            $notes += "**Strategy**: publish package versions prepared in the merged PR`n`n"
          }
          else {
            $notes += "**Strategy**: publish package versions from the approved manual range`n`n"
          }
          $notes += "### Published Packages`n`n"

          foreach ($pkg in $packages) {
            $url = "https://www.nuget.org/packages/$($pkg.Name)/$($pkg.Version)"
            $notes += "- [$($pkg.Name) v$($pkg.Version)]($url)`n"
          }

          $notes | Out-File -FilePath release-notes.md -Encoding utf8

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $tag = "release-$timestamp"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: 📦 Release - ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/**/*.nupkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    needs: [check-eligibility, analyze-changes, simple-publish]
    if: always() && needs.check-eligibility.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        shell: pwsh
        run: |
          Write-Host "================================================"
          Write-Host "Smart Publish Workflow Complete"
          Write-Host "================================================"
          Write-Host "✅ Changed packages were processed for publication"
          Write-Host "Packages published to NuGet.org"
